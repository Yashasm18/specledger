name: CI & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test-and-lint:
    name: Backend Test & Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Pytest Test Suite (243 Tests)
      run: |
        pytest -v

    - name: Analyze code with Pylint
      run: |
        pylint --rcfile=.pylintrc --fail-under=8.5 backend/

  frontend-build-and-typecheck:
    name: Frontend Build & Typecheck (React + Vite)
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: |
        npm install

    - name: Build Vite Production Bundle
      working-directory: frontend
      run: |
        npm run build

  unilog-delivery-verification:
    name: Unilog 252-Column Delivery Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Verify 252-Column Unilog CX1 Delivery Format
      run: |
        python3 -c "
        import csv
        with open('data/challenge/Unihack_ Enriched_Delivery_Output_252.csv', 'r', encoding='utf-8') as f:
            reader = csv.reader(f)
            header = next(reader)
            assert len(header) == 252, f'Expected 252 columns, got {len(header)}'
            rows = list(reader)
            assert len(rows) == 1000, f'Expected 1000 rows, got {len(rows)}'
            print(f'SUCCESS: Verified 252 columns across all {len(rows)} Unilog delivery rows!')
        "
