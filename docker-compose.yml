services:
  postgres:
    image: postgres:16-alpine
    container_name: specledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: specledger
      POSTGRES_USER: specledger
      POSTGRES_PASSWORD: specledger_dev_only
    ports:
      - "5432:5432"
    volumes:
      - specledger_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specledger -d specledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  specledger_postgres_data:

